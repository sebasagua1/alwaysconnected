<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#003DA5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141734" media="(prefers-color-scheme: dark)" />
    <!-- Modo oscuro antes del primer pintado. Va en un archivo aparte y no
         en línea porque la CSP de vercel.json bloquea los scripts en línea;
         el porqué completo está dentro de public/theme-init.js. -->
    <script src="/theme-init.js"></script>
    <!-- Pantalla de entrada. El CSS va aquí, en línea, y no en index.css: así
         está puesto en el PRIMER pintado, antes de que baje nada más (en
         desarrollo index.css lo inyecta el JS, tarde). La CSP de vercel.json
         permite estilos en línea ('unsafe-inline' en style-src); lo que
         bloquea son los scripts. Quién la quita y cuándo: src/lib/bootSplash.ts.
         El azul #141734 es el fondo del modo oscuro de la app (--background de
         .dark), y tiene que ser EL MISMO que el de LaunchScreen.storyboard
         (color LaunchBackground del catálogo de iOS): si no, se ve el salto. -->
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        background: #141734;
        color: #fff;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        transition: opacity 560ms cubic-bezier(0.4, 0, 0.2, 1);
        /* Capa propia desde el principio: el fundido de salida no obliga a
           recomponer la página entera en cada fotograma. */
        will-change: opacity;
      }
      .boot-splash--out {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash__brand {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Un poco por encima del centro: centrado exacto, un bloque así
           parece caído. */
        margin-bottom: 7vh;
        transition: transform 560ms cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
      }
      .boot-splash--out .boot-splash__brand {
        transform: scale(1.03);
      }
      .boot-splash__mark {
        position: relative;
        width: 104px;
        height: 104px;
      }
      /* Halo del azul de la marca detrás del logo: sin él, el cuadro azul
         sobre azul oscuro se queda plano. */
      .boot-splash__glow {
        position: absolute;
        inset: -110px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(38, 99, 214, 0.34), rgba(38, 99, 214, 0));
        animation: boot-fade 1400ms ease-out 100ms both;
        pointer-events: none;
      }
      .boot-splash__logo {
        position: relative;
        display: block;
        width: 104px;
        height: 104px;
        animation: boot-logo-in 900ms cubic-bezier(0.33, 1, 0.68, 1) both;
      }
      .boot-splash__name {
        margin: 22px 0 0;
        font-size: 26px;
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: -0.02em;
        animation: boot-rise 800ms cubic-bezier(0.33, 1, 0.68, 1) 300ms both;
      }
      .boot-splash__tagline {
        margin: 6px 0 0;
        font-size: 15px;
        line-height: 1.35;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.64);
        animation: boot-rise 800ms cubic-bezier(0.33, 1, 0.68, 1) 450ms both;
      }
      /* La entrada espera al primer fotograma visible: la pone y la quita
         public/theme-init.js (el porqué, allí). Curva de salida cúbica y
         no exponencial: la exponencial hacía casi todo el cambio en los
         primeros ~150 ms y el logo parecía aparecer de golpe. */
      .boot-wait .boot-splash__glow,
      .boot-wait .boot-splash__logo,
      .boot-wait .boot-splash__name,
      .boot-wait .boot-splash__tagline {
        animation-play-state: paused;
      }
      /* Idioma del lema: lo elige public/theme-init.js antes de pintar. */
      .boot-en { display: none; }
      [data-boot-lang='en'] .boot-es { display: none; }
      [data-boot-lang='en'] .boot-en { display: inline; }

      /* Barrita de «cargando». Solo aparece si el arranque pasa de 2,4 s:
         en uno normal no llega a verse (la pantalla se va hacia los 1,5 s). Fuera del flujo para no mover el
         logo cuando aparece. */
      .boot-splash__progress {
        position: absolute;
        top: 100%;
        left: 50%;
        width: 44px;
        height: 3px;
        margin: 30px 0 0 -22px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.14);
        opacity: 0;
        animation: boot-fade 400ms ease-out 2400ms forwards;
      }
      .boot-splash__progress::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: -40%;
        width: 40%;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.72);
        animation: boot-slide 1300ms ease-in-out infinite;
      }
      .boot-splash--status .boot-splash__progress { display: none; }

      /* Avisos (tarda / falla), abajo y a mano del pulgar. Los escribe
         React en #boot-splash-status (components/boot/StartupStatus.tsx). */
      .boot-splash__status,
      .boot-splash__fallback {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        padding: 0 24px calc(env(safe-area-inset-bottom, 0px) + 20px);
      }
      .boot-status {
        width: 100%;
        max-width: 360px;
        text-align: center;
        animation: boot-rise 280ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-status__title {
        margin: 0;
        font-size: 17px;
        line-height: 1.3;
        font-weight: 700;
      }
      .boot-status__body {
        margin: 6px 0 18px;
        font-size: 14px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.72);
      }
      .boot-status__button,
      .boot-splash__fallback span.boot-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-sizing: border-box;
        width: 100%;
        min-height: 50px;
        padding: 0 20px;
        border: 0;
        border-radius: 14px;
        background: #fff;
        color: #141734;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: transform 120ms ease-out, opacity 120ms ease-out;
      }
      .boot-status__button:active { transform: scale(0.98); }
      .boot-status__button:disabled { opacity: 0.72; cursor: default; }
      .boot-status__link {
        width: 100%;
        min-height: 44px;
        margin-top: 6px;
        border: 0;
        background: none;
        color: rgba(255, 255, 255, 0.82);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .boot-status__button:focus-visible,
      .boot-status__link:focus-visible,
      .boot-splash__fallback a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      /* Salida de emergencia si el JS no llega a arrancar: sin él nadie
         puede quitar esta pantalla ni avisar. Aparece a los 12 s, y
         main.tsx la desactiva en cuanto el JS corre. Un enlace y no un
         botón porque tiene que funcionar sin JS: recarga la app. */
      .boot-splash__fallback {
        visibility: hidden;
        opacity: 0;
        animation: boot-show 300ms ease-out 12s forwards;
      }
      .boot-splash__fallback a {
        width: 100%;
        max-width: 360px;
        text-decoration: none;
      }
      .boot-splash--js .boot-splash__fallback { display: none; }
      /* main.tsx no pudo cargar la app: sin esperar a los 12 s. */
      .boot-splash--failed .boot-splash__fallback { animation-delay: 0s; }
      .boot-splash--failed .boot-splash__progress { display: none; }

      @keyframes boot-logo-in {
        from { opacity: 0; transform: translateY(6px) scale(0.88); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes boot-show {
        to { opacity: 1; visibility: visible; }
      }
      @keyframes boot-slide {
        from { left: -40%; }
        to { left: 100%; }
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }

      /* Reducir movimiento: nada se desplaza ni cambia de tamaño. Solo
         fundidos, que es lo que el propio iOS usa en su lugar. */
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__logo,
        .boot-splash__name,
        .boot-splash__tagline,
        .boot-status {
          animation: boot-fade 220ms ease-out both;
        }
        .boot-splash__progress::after {
          left: 0;
          width: 100%;
          animation: boot-pulse 1600ms ease-in-out infinite;
        }
        .boot-splash--out .boot-splash__brand { transform: none; }
        .boot-status__button:active { transform: none; }
      }
    </style>
    <title>{{APP_NAME}} — Campus Social App</title>
    <meta name="description" content="{{APP_NAME}}: descubre, crea y únete a actividades reales en tu campus.">
    
    
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "{{APP_NAME}}",
            "description": "Campus social app that connects students through real activities.",
            "logo": "/icons/icon-512.png"
          },
          {
            "@type": "WebSite",
            "name": "{{APP_NAME}}",
            "description": "Descubre, crea y únete a actividades reales en tu campus."
          }
        ]
      }
    </script>
    <meta property="og:title" content="{{APP_NAME}} — Campus Social App">
  <meta name="twitter:title" content="{{APP_NAME}} — Campus Social App">
  <meta property="og:description" content="{{APP_NAME}}: descubre, crea y únete a actividades reales en tu campus.">
  <meta name="twitter:description" content="{{APP_NAME}}: descubre, crea y únete a actividades reales en tu campus.">
  <meta property="og:image" content="https://alwaysconnected.vercel.app/icons/icon-512.png">
  <meta name="twitter:image" content="https://alwaysconnected.vercel.app/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
</head>
  <body>
    <!-- Pantalla de entrada: ver el <style> de arriba y src/lib/bootSplash.ts.
         El logo es el de la app tal cual: la misma geometría que dibuja
         scripts/gen-app-assets.mjs para el icono y el splash (cuadro de 700
         con rx 160, y el pin trasladado 146 y escalado 17). Si cambia allí,
         cambia aquí. El lema repite auth.tagline de src/i18n/locales. -->
    <div id="boot-splash" class="boot-splash">
      <div class="boot-splash__brand">
        <div class="boot-splash__mark">
          <div class="boot-splash__glow" aria-hidden="true"></div>
          <svg class="boot-splash__logo" viewBox="0 0 700 700" aria-hidden="true" focusable="false">
            <rect width="700" height="700" rx="160" fill="#003DA5" />
            <path transform="translate(146 146) scale(17)" fill="#fff" fill-rule="evenodd" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" />
          </svg>
        </div>
        <p class="boot-splash__name">{{APP_NAME}}</p>
        <p class="boot-splash__tagline"><span class="boot-es" lang="es">Siempre hay algo.</span><span class="boot-en" lang="en">There's always something.</span></p>
        <div class="boot-splash__progress" aria-hidden="true"></div>
      </div>
      <div id="boot-splash-status" class="boot-splash__status"></div>
      <div class="boot-splash__fallback">
        <a href="/"><span class="boot-button"><span class="boot-es" lang="es">¿No carga? Reintentar</span><span class="boot-en" lang="en">Not loading? Try again</span></span></a>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
