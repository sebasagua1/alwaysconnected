# Despliegue de Edge Functions desde GitHub.
#
# Existe porque el deploy necesita un token de Supabase, y ese token no
# puede vivir ni en el repositorio ni en una conversación. Aquí vive donde
# debe: en Settings > Secrets and variables > Actions, cifrado, revocable
# desde el panel de Supabase y sin pasar por el portátil de nadie.
#
# Solo se dispara a mano (workflow_dispatch). Nada se despliega por el mero
# hecho de hacer push: un secreto de APNs mal puesto deja a toda la app sin
# notificaciones, así que el momento lo eliges tú.
#
# REQUISITO: el secreto SUPABASE_ACCESS_TOKEN.
#   Supabase > Account > Access Tokens > Generate new token
#   GitHub > Settings > Secrets and variables > Actions > New repository secret

name: Desplegar Edge Functions

on:
  workflow_dispatch:
    inputs:
      funcion:
        description: 'Qué función desplegar ("todas" para las tres)'
        required: true
        default: 'send-push'
        type: choice
        options:
          - send-push
          - delete-account
          - institution-verification
          - todas

# El ref del proyecto no es secreto: ya está en supabase/config.toml y en la
# URL pública de la API.
env:
  PROJECT_REF: myarlozvkbebygwszgkf

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Desplegar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Falta el secreto SUPABASE_ACCESS_TOKEN."
            echo "Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

          if [ "${{ inputs.funcion }}" = "todas" ]; then
            supabase functions deploy --project-ref "$PROJECT_REF"
          else
            supabase functions deploy "${{ inputs.funcion }}" --project-ref "$PROJECT_REF"
          fi
